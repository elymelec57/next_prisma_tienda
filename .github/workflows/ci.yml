name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

permissions:
  contents: read
  packages: write

# Cancela ejecuciones anteriores si se hace un nuevo push a la misma rama/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Lint, Typecheck, Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgresql://testuser:testpassword@localhost:5432/testdb"
      JWT_TOKEN: "ci_jwt_secret_token_placeholder"
      BLOB_READ_WRITE_TOKEN: "ci_blob_token_placeholder"
      NEXT_TELEMETRY_DISABLED: 1
      CI: true

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Cachear build de Next.js
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - name: Instalar dependencias
        run: npm ci

      - name: Generar cliente de Prisma
        run: npx prisma generate

      - name: Sincronizar esquema de base de datos de prueba
        run: npx prisma db push --skip-generate

      - name: Validar tipos con TypeScript
        run: npx tsc --noEmit

      - name: Ejecutar linter (ESLint)
        run: npm run lint

      - name: Compilar aplicación (Next.js Build)
        run: npm run build

      - name: Instalar navegadores de Playwright (Chromium)
        run: npx playwright install --with-deps chromium

      - name: Ejecutar pruebas E2E - Login (login.spec.ts)
        run: npx playwright test e2e/tests/login.spec.ts

      - name: Ejecutar pruebas E2E - Registro (register.spec.ts)
        if: success() || failure()
        run: npx playwright test e2e/tests/register.spec.ts

      - name: Subir reporte de Playwright en caso de fallo
        uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: . # Declara explícitamente la raíz del proyecto
          file: ./Dockerfile # Ajusta aquí la ruta si tu Dockerfile está dentro de alguna subcarpeta (ej: ./docker/Dockerfile)
          push: true
          tags: ghrc.io/elymelec57/next_prisma_tienda:latest